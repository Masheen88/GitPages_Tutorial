name: RouteClock APK
on:
  push:
    branches: [routeclock-apk-2026]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      # Assemble a debug-signed APK that Android can install directly.
      - name: Compile installable APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouteClock-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      # Publish a direct downloadable APK without the user needing a laptop.
      - name: Publish download to GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create routeclock-android-v1 app/build/outputs/apk/debug/app-debug.apk#RouteClock.apk --title "RouteClock Android APK" --notes "Personal open-map route ETA planner with departure alarms" --target "$GITHUB_SHA" || gh release upload routeclock-android-v1 app/build/outputs/apk/debug/app-debug.apk#RouteClock.apk --clobber